<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jembo Love Everybody</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    width: 100%;
    height: 100vh;
    overflow: hidden;
    background: #050014;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
}

/* Background gradient bergerak */
body::before {
    content: "";
    position: absolute;
    width: 500px;
    height: 500px;
    background: radial-gradient(circle, #ff0080, transparent 65%);
    filter: blur(60px);
    animation: glow 6s infinite alternate;
}

body::after {
    content: "";
    position: absolute;
    width: 400px;
    height: 400px;
    background: radial-gradient(circle, #7000ff, transparent 65%);
    filter: blur(60px);
    animation: glow2 7s infinite alternate;
}

@keyframes glow {
    from {
        transform: translate(-150px, -100px);
    }
    to {
        transform: translate(150px, 100px);
    }
}

@keyframes glow2 {
    from {
        transform: translate(150px, 100px);
    }
    to {
        transform: translate(-150px, -100px);
    }
}

/* Container */
.container {
    position: relative;
    z-index: 5;
    text-align: center;
}

/* Tulisan */
h1 {
    color: white;
    font-size: clamp(35px, 9vw, 85px);
    letter-spacing: 4px;
    text-transform: uppercase;

    text-shadow:
        0 0 5px #fff,
        0 0 15px #ff00aa,
        0 0 30px #ff00aa,
        0 0 60px #8b00ff;

    animation:
        appear 2s ease forwards,
        neon 2s infinite alternate;
}

@keyframes appear {
    from {
        opacity: 0;
        transform: scale(0.2) rotate(-10deg);
    }

    to {
        opacity: 1;
        transform: scale(1) rotate(0);
    }
}

@keyframes neon {
    from {
        text-shadow:
            0 0 5px white,
            0 0 15px #ff0080,
            0 0 30px #ff0080;
    }

    to {
        text-shadow:
            0 0 10px white,
            0 0 30px #8b00ff,
            0 0 60px #ff0080,
            0 0 100px #8b00ff;
    }
}

/* Heart */
.heart {
    display: inline-block;
    color: #ff176f;
    font-size: 1.1em;
    animation: heartbeat 1s infinite;
}

@keyframes heartbeat {
    0%, 100% {
        transform: scale(1);
    }

    25% {
        transform: scale(1.3);
    }

    40% {
        transform: scale(1);
    }

    60% {
        transform: scale(1.2);
    }
}

/* Subtitle */
.subtitle {
    margin-top: 25px;
    color: #fff;
    font-size: 16px;
    letter-spacing: 5px;
    opacity: 0;
    animation: subtitle 2s ease 1.5s forwards;
}

@keyframes subtitle {
    to {
        opacity: 0.8;
    }
}

/* Partikel */
.particle {
    position: absolute;
    width: 5px;
    height: 5px;
    background: white;
    border-radius: 50%;
    box-shadow: 0 0 10px white;
    animation: float linear infinite;
}

@keyframes float {
    from {
        transform: translateY(110vh) scale(0);
        opacity: 0;
    }

    20% {
        opacity: 1;
    }

    80% {
        opacity: 1;
    }

    to {
        transform: translateY(-10vh) scale(1.5);
        opacity: 0;
    }
}

/* Lingkaran dekorasi */
.circle {
    position: absolute;
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 50%;
    animation: rotate 12s linear infinite;
}

.circle.one {
    width: 250px;
    height: 250px;
}

.circle.two {
    width: 400px;
    height: 400px;
    animation-duration: 18s;
}

@keyframes rotate {
    from {
        transform: rotate(0deg) scale(1);
    }

    50% {
        transform: rotate(180deg) scale(1.15);
    }

    to {
        transform: rotate(360deg) scale(1);
    }
}
</style>
</head>

<body>

<!-- Dekorasi -->
<div class="circle one"></div>
<div class="circle two"></div>

<!-- Tulisan utama -->
<div class="container">

    <h1>
        Jembo <span class="heart">Love</span> Everybody
    </h1>

    <div class="subtitle">
        Tap Tap supaya jembo makin sayang
    </div>

</div>

<script>

/* Membuat partikel otomatis */
for (let i = 0; i < 60; i++) {

    const particle = document.createElement("div");

    particle.classList.add("particle");

    particle.style.left =
        Math.random() * 100 + "vw";

    particle.style.animationDuration =
        (Math.random() * 6 + 4) + "s";

    particle.style.animationDelay =
        Math.random() * 5 + "s";

    particle.style.opacity =
        Math.random();

    document.body.appendChild(particle);
}

/* Klik layar = muncul banyak hati */
document.addEventListener("click", function(e) {

    for (let i = 0; i < 8; i++) {

        const heart = document.createElement("div");

        heart.innerHTML = "♥";

        heart.style.position = "fixed";
        heart.style.left = e.clientX + "px";
        heart.style.top = e.clientY + "px";
        heart.style.color = "#ff2b91";
        heart.style.fontSize = "25px";
        heart.style.pointerEvents = "none";
        heart.style.zIndex = "100";

        document.body.appendChild(heart);

        const x = (Math.random() - 0.5) * 200;
        const y = -Math.random() * 200;

        heart.animate([
            {
                transform: "translate(0,0) scale(1)",
                opacity: 1
            },
            {
                transform:
                    `translate(${x}px, ${y}px) scale(0)`,
                opacity: 0
            }
        ], {
            duration: 1200,
            easing: "ease-out"
        });

        setTimeout(() => {
            heart.remove();
        }, 1200);
    }
});

</script>

</body>
</html>
